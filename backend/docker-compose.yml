services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      - postgres

    env_file:
      - .env

    environment:
      - PORT=$BE_PORT
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=$POSTGRES_USER
      - PG_PASSWORD=$POSTGRES_PASSWORD
      - PG_DB=$POSTGRES_DB

    ports:
      - ${BE_PORT}:${BE_PORT}
    
    volumes:
      - .:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port ${BE_PORT}
      --reload

    

  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Uncomment only if you need to connect from your host machine
    # (e.g. DBeaver, local psql). Since pgAdmin is also in Docker,
    # this can remain commented to avoid port conflicts.
    #
    # ports:
    #   - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  minio_data: